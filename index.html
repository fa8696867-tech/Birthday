<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28 — квест для легенды 💖</title><style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#fff}*{box-sizing:border-box}body{overflow-x:hidden;margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#e34f9a,transparent 40%),radial-gradient(circle at 90% 90%,#7e3cbb,transparent 45%),#211333;display:grid;place-items:center;padding:20px}.card{width:min(100%,620px);background:#ffffff17;border:1px solid #ffffff40;backdrop-filter:blur(18px);border-radius:30px;padding:clamp(20px,5vw,40px);box-shadow:0 24px 70px #160a3066;text-align:center}h1{font-size:clamp(30px,7vw,48px);line-height:1.12;margin:14px 0}h2{font-size:clamp(23px,5vw,31px)}p{line-height:1.6}.muted{color:#f4d9ee}.photo{width:100%;height:auto;max-height:65vh;object-fit:contain;border-radius:22px;display:block;margin:auto;background:#ffffff18;border:2px dashed #ffffff65}.placeholder{height:245px;border:2px dashed #ffffff80;border-radius:22px;display:grid;place-content:center;gap:10px;color:#ffe4f5}.placeholder b{font-size:56px}button{border:0;border-radius:15px;padding:15px 20px;font:700 16px system-ui;cursor:pointer;transition:.15s}button:hover{transform:translateY(-2px)}.primary{background:#ffdb6c;color:#382044;margin-top:16px}.options{display:grid;gap:12px;margin:22px 0}.option{background:#fff;color:#3c2350;text-align:left}.option.correct{background:#a8f0bc}.option.wrong{background:#ffb5c7}.feedback{min-height:30px;font-weight:700}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:8px;background:#ffffff40;border-radius:30px;overflow:hidden;margin:16px 0 25px}.bar{height:100%;background:#ffda69;transition:width .3s}.sound{background:#ffffff30;color:#fff;padding:10px}.hidden{display:none}.answer{width:100%;padding:16px;border-radius:15px;border:0;font-size:18px}.code{overflow-wrap:anywhere;background:#ffffff25;border-radius:18px;padding:18px;font-weight:800;font-size:19px}small{color:#e8d4e8}@keyframes fall{from{transform:translateY(-15vh) rotate(0deg);opacity:1}to{transform:translateY(115vh) rotate(540deg);opacity:.1}}@keyframes pop{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}.falling{position:fixed;top:-10vh;pointer-events:none;z-index:5;animation:fall linear forwards}.spark{position:fixed;pointer-events:none;z-index:10;animation:pop 1.5s ease-out forwards}.photo{box-shadow:0 10px 35px #11091e55;border:2px solid #ffffff70}.card{position:relative;z-index:2}</style></head><body><main class="card"><div class="top"><span id="counter">🎉 Birthday Quest</span><button class="sound" id="sound" onclick="toggleMusic()">🔇 Музыка</button></div><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div><div id="app"></div></main><audio id="music" src="music.mp3" loop></audio><script>
// Фотографии: положи файлы в папку photos и назови их cover.jpg, 1.jpg ... 11.jpg.
const questions=[
{q:'Где началась наша легендарная дружба?',a:['В общаге','В библиотеке','В маршрутке','На лекции по философии'],right:0},
{q:'После новоселья с Мальцевым, куда мы отправились?',a:['Домой спать','В клуб','На пробежку','В музей'],right:1},
{q:'Кто в зоопарке бежал за Яной?',a:['Страус','Козёл','Лама','Смотритель'],right:2},
{q:'Кто у нас "Пластилин"?',a:['Влад','Мальцев','Саша','Охранник клуба'],right:0},
{q:'В первый приезд в Днепр мы пошли…',a:['В театр','В SOHO','На экскурсию','В библиотеку'],right:1},
{q:'Сколько чаевых мы оставили официантке?',a:['10 грн','500 грн','100 грн','Ничего, только улыбку'],right:2},
{q:'Куда Ксюха хотела ехать?',a:['На Мальдивы','На Малинки','В Париж','На пары'],right:1},
{q:'Что такое «ёлочки»?',a:['Новогодний декор','Секретная остановка для очищения желудка','Название коктейля','Наш танцевальный коллектив'],right:1},
{q:'Кого Ксю встретила в Полтаве?',a:['Сашу Белого','Деда Мороза','Ректора','Своего двойника'],right:0},

{q:'Кто давал джаза возле «Пьяной вишни»?',a:['Диджей','Ксюха','Настя','Прохожий'],right:2},
{q:'На кого гавкал Ламбик? 🐶',a:['На котов 🐈','На прохожих 🚶','На голубей 🕊️','На Мальцева 😂'],right:2},
{q:'Последняя точка сбора? Напиши название сама 💌',typed:'южный'}
];

let step=-1,locked=false;

  
const app = document.getElementById('app');
const audio = document.getElementById('music');
const soundButton = document.getElementById('sound');
let musicEnabled = true;
let finalCelebrated = false;

function photo(name) {
  return `<img class="photo" src="photos/${name}.jpg" alt="Наше воспоминание" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'📸 Фото воспоминания'}))">`;
}

function render() {
  const total = questions.length;
  document.getElementById('counter').textContent = step < 0 ? '🎉 Birthday Quest' : step >= total ? '🏆 Финал' : `💖 Вопрос ${step + 1} из ${total}`;
  document.getElementById('bar').style.width = `${step >= total ? 100 : Math.max(0,step / total * 100)}%`;

  if (step < 0) {
    app.innerHTML = `${photo('cover')}
      <h1>Ну вот тебе и 28! 🥂</h1>
      <p>Прекрасный возраст, чтобы вспомнить всё… ну или почти всё 😏</p>
      <p class="muted">Чтобы получить поздравление и подарок, тебе придётся пройти квест по нашим легендарным приключениям!</p>
      <button class="primary" onclick="start()">Готова начать праздничный квест? 💖</button>`;
    return;
  }

  if (step === total) {
    app.innerHTML = `
      <h1>С днём рождения, легенда! 🎂💗</h1>
      <p>28 — это только начало новых приключений, историй, которые невозможно рассказывать при родителях, и воспоминаний, от которых мы будем смеяться ещё много лет!</p>
      <p>Спасибо, что ты есть в моей жизни. Желаю тебе счастья, любви, исполнения самых сумасшедших желаний и чтобы у нас впереди было ещё миллион таких историй! 🥹💕</p>
      <h2>🎁 Твой подарок уже ждёт!</h2>
      <p>Чтобы получить его, напиши в нашу группу кодовое слово:</p>
      <div class="code" id="code">Полтавський педагогічний національний університет імені Володимира Галактіоновича Короленка</div>
      <button class="primary" onclick="copyCode(this)">📋 Скопировать код</button>`;
    if (!finalCelebrated) {
      finalCelebrated = true;
      celebrate(120);
    }
    return;
  }

  locked = false;
  const x = questions[step];
  const imageName = step === total - 1 ? 'cover' : String(step + 1);

  app.innerHTML = `${photo(imageName)}
    <h2>${x.q}</h2>
    ${x.typed
      ? `<input class="answer" id="typed" placeholder="Твой ответ…" autocomplete="off">
         <button class="primary" onclick="checkTyped()">Проверить ответ ✨</button>`
      : `<div class="options">${x.a.map((v,i)=>`<button class="option" onclick="check(${i},this)">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div>`
    }
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div id="next"></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function start() {
  step = 0;
  attemptAutoplay();
  render();
}

function success() {
  locked = true;
  celebrate(32);
  document.getElementById('feedback').textContent = '🎉 Верно! Память у тебя ещё работает!';
  document.getElementById('next').innerHTML = '<button class="primary" onclick="step++;render()">Дальше →</button>';
}

function check(i,btn) {
  if (locked) return;
  if (i === questions[step].right) {
    btn.classList.add('correct');
    document.querySelectorAll('.option').forEach(b=>b.disabled=true);
    success();
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').textContent = '😂 Ну ты даёшь! Попробуй ещё раз!';
    setTimeout(()=>btn.classList.remove('wrong'),750);
  }
}

function checkTyped() {
  if (locked) return;
  const value = document.getElementById('typed').value.trim().toLowerCase().replace(/\s+/g,' ');
  if (value === questions[step].typed) success();
  else document.getElementById('feedback').textContent = '🤭 Не-а! Вспоминай нашу последнюю точку сбора!';
}

function celebrate(count=40) {
  const icons = ['🎉','🎊','💖','✨','🎆','💸','💵','🥳'];
  for (let i=0;i<count;i++) {
    const e=document.createElement('span');
    e.className='spark';
    e.textContent=icons[Math.floor(Math.random()*icons.length)];
    e.style.left=(20+Math.random()*60)+'vw';
    e.style.top=(20+Math.random()*55)+'vh';
    e.style.fontSize=(18+Math.random()*23)+'px';
    e.style.setProperty('--dx',(Math.random()*900-450)+'px');
    e.style.setProperty('--dy',(Math.random()*700-350)+'px');
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),1600);
  }
}

function rain() {
  const icons=['💸','💵','💖','🎈','✨','🥳'];
  const e=document.createElement('span');
  e.className='falling';
  e.textContent=icons[Math.floor(Math.random()*icons.length)];
  e.style.left=Math.random()*100+'vw';
  e.style.fontSize=(18+Math.random()*18)+'px';
  e.style.animationDuration=(5+Math.random()*5)+'s';
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),10500);
}

setInterval(rain,700);

function attemptAutoplay() {
  if (!musicEnabled || !audio.paused) return;
  audio.play()
    .then(()=>soundButton.textContent='🔊 Музыка')
    .catch(()=>{soundButton.textContent='🔇 Включить музыку';});
}

function toggleMusic() {
  if (!audio.paused) {
    musicEnabled=false;
    audio.pause();
    soundButton.textContent='🔇 Музыка';
  } else {
    musicEnabled=true;
    attemptAutoplay();
  }
}

async function copyCode(button) {
  const code=document.getElementById('code').textContent;
  try {
    await navigator.clipboard.writeText(code);
    button.textContent='💌 Код скопирован!';
  } catch {
    button.textContent='Выдели и скопируй код выше 💌';
  }
}

window.addEventListener('load',attemptAutoplay);
document.addEventListener('pointerdown',()=>{
  if(musicEnabled) attemptAutoplay();
},{once:true});

render();
</script>
</body>
</html>
