<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 — квест для легенды 💖</title>
<style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 15%,#e34f9a,transparent 40%),radial-gradient(circle at 90% 90%,#7e3cbb,transparent 45%),#211333;display:grid;place-items:center;padding:20px}.card{width:min(100%,620px);background:#ffffff17;border:1px solid #ffffff40;backdrop-filter:blur(18px);border-radius:30px;padding:clamp(20px,5vw,40px);box-shadow:0 24px 70px #160a3066;text-align:center;position:relative;z-index:2}h1{font-size:clamp(30px,7vw,48px);line-height:1.12;margin:14px 0}h2{font-size:clamp(23px,5vw,31px)}p{line-height:1.6}.muted{color:#f4d9ee}.photo{width:100%;height:auto;max-height:65vh;object-fit:contain;border-radius:22px;display:block;margin:auto;background:#ffffff18;border:2px solid #ffffff70;box-shadow:0 10px 35px #11091e55}.placeholder{min-height:220px;border:2px dashed #ffffff80;border-radius:22px;display:grid;place-content:center;gap:10px;color:#ffe4f5}.placeholder b{font-size:56px}button{border:0;border-radius:15px;padding:15px 20px;font:700 16px system-ui;cursor:pointer;transition:transform .15s}button:hover{transform:translateY(-2px)}.primary{background:#ffdb6c;color:#382044;margin-top:16px}.options{display:grid;gap:12px;margin:22px 0}.option{background:#fff;color:#3c2350;text-align:left}.option.correct{background:#a8f0bc}.option.wrong{background:#ffb5c7}.feedback{min-height:30px;font-weight:700}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:8px;background:#ffffff40;border-radius:30px;overflow:hidden;margin:16px 0 25px}.bar{height:100%;background:#ffda69;transition:width .3s}.sound{background:#ffffff30;color:#fff;padding:10px}.answer{width:100%;padding:16px;border-radius:15px;border:0;font-size:18px}.code{overflow-wrap:anywhere;background:#ffffff25;border-radius:18px;padding:18px;font-weight:800;font-size:19px}@keyframes fall{from{transform:translateY(-15vh) rotate(0);opacity:1}to{transform:translateY(115vh) rotate(540deg);opacity:.1}}@keyframes pop{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}.falling{position:fixed;top:-10vh;pointer-events:none;z-index:5;animation:fall linear forwards}.spark{position:fixed;pointer-events:none;z-index:10;animation:pop 1.5s ease-out forwards}@media(prefers-reduced-motion:reduce){.falling,.spark{display:none}}
</style>
</head>
<body>
<main class="card"><div class="top"><span id="counter">🎉 Birthday Quest</span><button class="sound" id="sound" type="button">🔇 Музыка</button></div><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div><div id="app"></div></main>
<audio id="music" src="music.mp3" preload="auto" loop></audio>
<script>
'use strict';
const questions=[
{q:'Где началась наша легендарная дружба?',a:['В общаге','В библиотеке','В маршрутке','На лекции по философии'],right:0},
{q:'После новоселья с Мальцевым, куда мы отправились?',a:['Домой спать','В клуб','На пробежку','В музей'],right:1},
{q:'Кто в зоопарке бежал за Яной?',a:['Страус','Козёл','Лама','Смотритель'],right:2},
{q:'Кто у нас «Пластилин»?',a:['Влад','Мальцев','Саша','Охранник клуба'],right:0},
{q:'В первый приезд в Днепр мы пошли…',a:['В театр','В SOHO','На экскурсию','В библиотеку'],right:1},
{q:'Сколько чаевых мы оставили официантке?',a:['10 грн','500 грн','100 грн','Ничего, только улыбку'],right:2},
{q:'Куда Ксюха хотела ехать?',a:['На Мальдивы','На Малинки','В Париж','На пары'],right:1},
{q:'Что такое «ёлочки»?',a:['Новогодний декор','Секретная остановка для очищения желудка','Название коктейля','Наш танцевальный коллектив'],right:1},
{q:'Кого Ксю встретила в Полтаве?',a:['Сашу Белого','Деда Мороза','Ректора','Своего двойника'],right:0},
{q:'Кто давал джаза возле «Пьяной вишни»?',a:['Диджей','Ксюха','Настя','Прохожий'],right:2},
{q:'На кого гавкал Ламбик? 🐶',a:['На котов 🐈','На прохожих 🚶','На голубей 🕊️','На Мальцева 😂'],right:2},
{q:'Последняя точка сбора? Напиши название сама 💌',typed:'южный'}
];
const app=document.getElementById('app');
const audio=document.getElementById('music');
const sound=document.getElementById('sound');
const counter=document.getElementById('counter');
const bar=document.getElementById('bar');
let step=-2,locked=false,musicEnabled=true,finalCelebrated=false;

function photo(name){
 const wrap=document.createElement('div');
 const img=document.createElement('img');
 img.className='photo';img.src='photos/'+name+'.jpg';img.alt='Наше воспоминание';
 img.onerror=()=>{wrap.innerHTML='<div class="placeholder"><b>📸</b><span>Здесь будет ваше фото</span></div>';};
 wrap.appendChild(img);return wrap;
}
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el;}
function addPhoto(name){app.appendChild(photo(name));}
function addButton(text,fn,cls='primary'){const b=element('button',text,cls);b.type='button';b.addEventListener('click',fn);app.appendChild(b);return b;}
function addText(tag,text,cls){app.appendChild(element(tag,text,cls));}
function next(){step++;render();}
function render(){
 app.replaceChildren();locked=false;
 counter.textContent=step<0?'🎉 Birthday Quest':step>=questions.length?'🏆 Финал':`💖 Вопрос ${step+1} из ${questions.length}`;
 bar.style.width=(step>=questions.length?100:step<0?0:Math.round(step/questions.length*100))+'%';
 if(step===-2){
   addPhoto('cover');addText('h1','Ну вот тебе и 28! 🥂');
   addText('p','Прекрасный возраст, чтобы вспомнить всё… ну или почти всё 😏');
   addText('p','Чтобы получить поздравление и подарок, придётся пройти квест по нашим легендарным приключениям!','muted');
   addButton('Дальше 💖',next);return;
 }
 if(step===-1){
   addPhoto('cover');addText('h1','Готова окунуться в воспоминания? 💃');
   addText('p','Впереди 12 вопросов, немного компромата, море смеха и секретный подарок!');
   addButton('Да, погнали! 🎉',()=>{playMusic();next();});return;
 }
 if(step>=questions.length){
   addText('h1','С днём рождения, легенда! 🎂💗');
   addText('p','28 — только начало новых приключений, историй, которые невозможно рассказывать при родителях, и воспоминаний, над которыми мы будем смеяться ещё много лет!');
   addText('p','Спасибо, что ты есть в моей жизни. Желаю счастья, любви, исполнения самых сумасшедших желаний и ещё миллиона совместных историй! 🥹💕');
   addText('h2','🎬 А теперь — видео для тебя!');
   const video=document.createElement('video');
   video.src='video.mp4';video.controls=true;video.playsInline=true;video.preload='metadata';
   video.style.cssText='width:100%;max-height:65vh;border-radius:20px;margin:18px 0;background:#160a30';
   app.appendChild(video);
   addText('h2','🎁 Твой подарок уже ждёт!');
   addText('p','Чтобы получить его, напиши в нашу группу кодовое слово:');
   const code='Полтавський Педагогічний Національний Університет імені Володимира Галактіоновича Короленка';
   addText('div',code,'code');
   addButton('📋 Скопировать код',async()=>{try{await navigator.clipboard.writeText(code);alert('💌 Код скопирован!');}catch{alert('Выдели и скопируй код вручную 💌');}});
   if(!finalCelebrated){finalCelebrated=true;celebrate(120);}return;
 }
 const q=questions[step];addPhoto(step===questions.length-1?'cover':String(step+1));addText('h2',q.q);
 const feedback=element('div','','feedback');const nextBox=element('div');
 function success(){if(locked)return;locked=true;feedback.textContent='🎉 Верно! Память у тебя ещё работает!';celebrate(32);const b=element('button','Дальше →','primary');b.addEventListener('click',next);nextBox.appendChild(b);}
 if(q.typed){
   const input=element('input',undefined,'answer');input.placeholder='Твой ответ…';input.autocomplete='off';
   const check=()=>{if(locked)return;const value=input.value.trim().toLowerCase().replace(/\s+/g,' ');if(value===q.typed)success();else feedback.textContent='🤭 Не-а! Вспоминай нашу последнюю точку сбора!';};
   input.addEventListener('keydown',e=>{if(e.key==='Enter')check();});app.appendChild(input);
   addButton('Проверить ответ ✨',check);
 }else{
   const options=element('div',undefined,'options');
   q.a.forEach((answer,i)=>{
     const btn=element('button',String.fromCharCode(65+i)+'. '+answer,'option');
     btn.addEventListener('click',()=>{
       if(locked)return;
       if(i===q.right){btn.classList.add('correct');options.querySelectorAll('button').forEach(b=>b.disabled=true);success();}
       else{btn.classList.add('wrong');feedback.textContent='😂 Ну ты даёшь! Попробуй ещё раз!';setTimeout(()=>btn.classList.remove('wrong'),750);}
     });options.appendChild(btn);
   });app.appendChild(options);
 }
 app.append(feedback,nextBox);window.scrollTo({top:0,behavior:'smooth'});
}
function celebrate(count=40){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const icons=['🎉','🎊','💖','✨','🎆','💸','💵','🥳'];
 for(let i=0;i<count;i++){
  const e=element('span',icons[Math.floor(Math.random()*icons.length)],'spark');
  e.style.left=(20+Math.random()*60)+'vw';e.style.top=(20+Math.random()*55)+'vh';
  e.style.fontSize=(18+Math.random()*23)+'px';e.style.setProperty('--dx',(Math.random()*900-450)+'px');e.style.setProperty('--dy',(Math.random()*700-350)+'px');
  document.body.appendChild(e);setTimeout(()=>e.remove(),1600);
 }
}
function rain(){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const icons=['💸','💵','💖','🎈','✨','🥳'];const e=element('span',icons[Math.floor(Math.random()*icons.length)],'falling');
 e.style.left=Math.random()*100+'vw';e.style.fontSize=(18+Math.random()*18)+'px';e.style.animationDuration=(5+Math.random()*5)+'s';
 document.body.appendChild(e);setTimeout(()=>e.remove(),10500);
}
setInterval(rain,700);
function playMusic(){if(!musicEnabled||!audio.paused)return;audio.play().then(()=>sound.textContent='🔊 Музыка').catch(()=>sound.textContent='🔇 Включить музыку');}
sound.addEventListener('click',()=>{if(audio.paused){musicEnabled=true;playMusic();}else{musicEnabled=false;audio.pause();sound.textContent='🔇 Музыка';}});
window.addEventListener('load',playMusic);
document.addEventListener('pointerdown',()=>{if(musicEnabled&&audio.paused)playMusic();},{once:true});
render();
</script>
</body>
</html>
